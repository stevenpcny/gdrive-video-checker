<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'">
<title>谷歌云盘视频检查器</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="sidebar">
  <div id="remote-bar">
    <select id="remote-sel"></select>
    <button id="import-btn" title="添加或导入 Google Drive 账号">＋账号</button>
    <input type="file" id="import-file" accept=".json,application/json" hidden>
    <input type="file" id="config-file" accept=".conf,text/plain" hidden>
  </div>
  <div id="link-bar">
    <input id="link-paste-input" placeholder="粘贴别人给的 Drive 文件夹链接">
    <button id="link-paste-btn" title="打开「任何知道链接的人可查看/编辑」的 Drive 文件夹">打开链接</button>
  </div>
  <div id="crumbs"></div>
  <div id="sort-bar">排序
    <select id="sort-sel">
      <option value="name">名称</option>
      <option value="new">日期 新→旧</option>
      <option value="old">日期 旧→新</option>
    </select>
    <button id="upload-btn" title="上传视频到当前文件夹（可多选）">⬆ 添加视频</button>
    <input type="file" id="upload-file" accept="video/*" multiple hidden>
    <button id="link-btn" title="复制当前文件夹的 Google Drive 链接">🔗 复制链接</button>
  </div>
  <div id="list"></div>
  <div id="stats"></div>
  <div id="cfg">
    <div class="cfg-row">不合格移入子文件夹：<input id="subdir" value="不合格"></div>
    <div class="cfg-row ram-row">
      <label>RAM 缓存 <input id="ram-cache-gb" type="number" min="1" step="0.5" placeholder="自动"> GB</label>
      <label>单视频 <input id="ram-video-gb" type="number" min="0.1" step="0.1" placeholder="自动"> GB</label>
    </div>
    <div id="ram-hint"></div>
  </div>
</div>
<div id="main">
  <div id="player-wrap">
    <div id="placeholder">
      在左侧选择包含视频的文件夹<br><br>
      <kbd>空格</kbd> 播放/暂停　<kbd>←</kbd>/<kbd>→</kbd> 跳5秒　<kbd>Shift+←/→</kbd> 跳30秒　<kbd>,</kbd>/<kbd>.</kbd> 逐帧<br>
      <kbd>↑</kbd>/<kbd>↓</kbd> 倍速　<kbd>M</kbd> 静音　<kbd>G</kbd> 合格并下一个　<kbd>B</kbd> 不合格并下一个<br>
      <kbd>Enter</kbd> 下一个　<kbd>P</kbd> 上一个　拖动进度条可逐帧看画面
    </div>
    <video id="video" preload="auto" style="display:none"></video>
    <img id="scrub-overlay" alt="">
    <button id="prev-btn" class="ov-nav" title="P">‹</button>
    <button id="next-btn" class="ov-nav" title="Enter">›</button>
    <div id="ov-marks">
      <button class="ok" id="ok-btn" title="G">✓ 合格</button>
      <button class="bad" id="bad-btn" title="B">✗ 不合格</button>
    </div>
    <button id="folder-done-btn">✓ 这组检查完了，进入下一个文件夹 ▸</button>
    <div id="toast"><span id="toast-msg"></span><button id="undo-btn">撤销</button></div>
  </div>
  <div id="seek-area">
    <div id="seekbar">
      <div id="seek-track"><div id="seek-buffered"></div><div id="seek-played"></div></div>
      <div id="seek-handle"></div>
      <div id="seek-tip"></div>
    </div>
    <div id="seek-info"><span id="time-cur">0:00</span><span id="load-state"></span><span id="time-dur">0:00</span></div>
  </div>
  <div id="bar">
    <button id="play-btn" title="空格">▶</button>
    <span id="cur-name">未选择视频</span>
    <span id="speed">1.0x</span>
    <button id="mute-btn" title="M">🔊</button>
    <button id="prev-folder-btn" title="按当前排序跳到父文件夹里的上一个文件夹">◂ 上一个文件夹</button>
    <button id="next-folder-btn" title="按当前排序跳到父文件夹里的下一个文件夹">下一个文件夹 ▸</button>
    <button id="copy-result-btn" title="按视频编号从小到大，复制这组检查结果，可直接粘贴到表格一列">📋 复制检查结果</button>
  </div>
</div>

<div id="account-modal" class="modal" hidden>
  <div class="modal-card">
    <h2>连接 Google Drive</h2>
    <p>账号配置只保存在这台 Mac 的 Application Support 中。</p>
    <div id="account-choices" class="account-actions">
      <button id="service-account-btn"><b>服务账号 JSON</b><br><small>导入管理员提供的 service_account 密钥</small></button>
      <button id="rclone-config-btn"><b>导入 rclone.conf</b><br><small>复制并验证已有的 rclone 配置文件</small></button>
      <button id="oauth-btn"><b>Google OAuth</b><br><small>读取 Google Cloud JSON，再在浏览器登录</small></button>
    </div>
    <div id="oauth-panel" hidden>
      <div class="form-row"><label>账号名称</label><input id="oauth-name" value="gdrive" maxlength="32"></div>
      <div class="form-row"><label>Client ID（可选）</label><input id="oauth-client-id"></div>
      <div class="form-row"><label>Client Secret（可选）</label><input id="oauth-client-secret" type="password"></div>
      <button id="oauth-json-btn">读取 Google Cloud OAuth JSON</button>
      <div id="oauth-json-status" role="status"></div>
      <button id="oauth-start-btn">开始配置</button>
      <div id="oauth-question" hidden></div>
      <div id="oauth-answer-row" class="form-row" hidden>
        <label id="oauth-answer-label">回答</label>
        <div id="oauth-answer-control"></div>
      </div>
      <div class="modal-buttons" id="oauth-step-buttons" hidden>
        <button id="oauth-cancel-btn">取消配置</button>
        <button id="oauth-continue-btn">继续</button>
      </div>
    </div>
    <div class="modal-buttons"><button id="account-close-btn">关闭</button></div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
